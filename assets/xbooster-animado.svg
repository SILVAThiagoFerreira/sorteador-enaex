<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Mascote X-Booster com pequena explosão estilizada">
<style>@keyframes boom{0%,8%{transform:scale(.55) rotate(-8deg);opacity:.2}25%{transform:scale(1.12) rotate(3deg);opacity:1}50%{transform:scale(.92);opacity:.7}80%,100%{transform:scale(.66) rotate(8deg);opacity:.25}}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}24%{transform:translateY(-12px) rotate(4deg)}50%{transform:translateY(-3px) rotate(-2deg)}75%{transform:translateY(-7px) rotate(2deg)}}@keyframes spark{0%,100%{opacity:.15;transform:scale(.75)}30%{opacity:1;transform:scale(1.12)}70%{opacity:.55;transform:scale(.95)}}@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(20deg)}}@keyframes blink{0%,40%,46%,100%{transform:scaleY(1)}43%{transform:scaleY(.15)}}.blast{transform-origin:120px 116px;animation:boom 2s ease-in-out infinite}.mascot{transform-origin:120px 155px;animation:bounce 2s ease-in-out infinite}.sparks{transform-origin:120px 116px;animation:spark 2s ease-in-out infinite}.arm-left{transform-origin:81px 113px;animation:wave 1s ease-in-out infinite alternate}.arm-right{transform-origin:159px 113px;animation:wave 1s .3s ease-in-out infinite alternate-reverse}.eyes{transform-origin:120px 99px;animation:blink 3.2s infinite}@media(prefers-reduced-motion:reduce){.blast,.mascot,.sparks,.arm-left,.arm-right,.eyes{animation:none}}</style><defs><linearGradient id="body" x1="0" x2="1"><stop stop-color="#aa1022"/><stop offset=".28" stop-color="#f32936"/><stop offset=".72" stop-color="#db172a"/><stop offset="1" stop-color="#9d1020"/></linearGradient><radialGradient id="burst"><stop stop-color="#fff3af"/><stop offset=".65" stop-color="#ffb945"/><stop offset="1" stop-color="#f57149"/></radialGradient></defs>
<circle cx="120" cy="120" r="109" fill="#eef4f5"/>
<g class="blast" transform-origin="120 116"><path d="M120 24l11 28 20-17-2 30 29-8-16 25 31 5-26 15 24 19-31 1 12 28-27-12-5 30-17-25-16 25-4-30-28 12 13-28-31-1 24-19-26-15 30-5-15-25 29 8-2-30 20 17z" fill="url(#burst)" opacity=".92"/><path d="M120 48l9 27 25-12-11 26 27 4-23 15 18 20-28-5-3 28-14-23-14 23-3-28-28 5 18-20-23-15 27-4-11-26 25 12z" fill="#fff0bf"/></g>
<g class="sparks" fill="#ec4651"><circle cx="42" cy="88" r="4"/><circle cx="199" cy="90" r="4"/><path d="M44 148l4 6-5 5-4-6zM194 145l5 4-4 6-5-4z"/><path d="M82 32l3 7-6 3-3-7zM165 30l-3 8 6 3 3-8z" fill="#f3b44c"/></g>
<g class="mascot" transform-origin="120 155"><path d="M92 166l-11 15m68-15 11 15" fill="none" stroke="#364a52" stroke-width="7" stroke-linecap="round"/><ellipse cx="76" cy="184" rx="12" ry="6" fill="#344b56"/><ellipse cx="165" cy="184" rx="12" ry="6" fill="#344b56"/><g class="arm-left"><path d="M81 113l-16 9" fill="none" stroke="#a71928" stroke-width="8" stroke-linecap="round"/><circle cx="62" cy="123" r="6" fill="#f0c3ad"/></g><g class="arm-right"><path d="M159 113l16 9" fill="none" stroke="#a71928" stroke-width="8" stroke-linecap="round"/><circle cx="178" cy="123" r="6" fill="#f0c3ad"/></g><path d="M83 57Q120 45 157 57v101q0 13-37 13t-37-13z" fill="url(#body)" stroke="#9e1422" stroke-width="2"/><ellipse cx="120" cy="57" rx="37" ry="10" fill="#f7474a" stroke="#ae1424" stroke-width="2"/><path d="M96 68v88" stroke="#ff8580" stroke-width="4" opacity=".6" stroke-linecap="round"/><path class="eyes" d="M102 99q5-5 10 0m17 0q5-5 10 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><ellipse cx="120" cy="112" rx="4.5" ry="6" fill="#77202a"/><path d="M101 132h38" stroke="#fff" stroke-width="2" opacity=".7"/><text x="120" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">X-BOOSTER</text><path d="M102 149h36m-31 5h26" stroke="#fff" stroke-width="1.3" opacity=".7"/></g></svg>